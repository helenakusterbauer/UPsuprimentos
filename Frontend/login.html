<!doctype html>
<html lang="pt-BR">


<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Entrar | UP Suprimentos</title>
    <link rel="stylesheet" href="css/style.css">
</head>


<body class="login-layout">
    <main class="login-card">
        <a class="brand" href="index.html"><img src="assets/logo.png.jpeg" alt="Logo">UP <small>SUPRIMENTOS</small></a>
        <h1>Acesso à gestão</h1>
        <p class="muted">Entre com seu usuário cadastrado no sistema.</p>
        <form id="login-form"><label class="field">E-mail<input id="email" type="email" autocomplete="username" required></label><label class="field">Senha<input id="senha" type="password" autocomplete="current-password" required></label>
            <p id="erro" class="error" role="alert"></p><button class="btn" type="submit">Entrar</button></form>
        <p><a href="index.html">← Voltar ao catálogo</a></p>
    </main>
    <script src="js/config.js"></script>
    <script src="js/login.js"></script>
</body>


</html>
